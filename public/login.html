<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Dispatch SOP</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23b4532a'/%3E%3Cpath d='M9 12l7-4 7 4v8l-7 4-7-4z' fill='none' stroke='white' stroke-width='2'/%3E%3C/svg%3E">
<style>
  :root { --bg:#f6f2ec; --card:#fff; --ink:#22201c; --muted:#6f685e; --line:#e4ddd2; --brand:#b4532a; --brand-ink:#fff; --err:#b42318; }
  @media (prefers-color-scheme: dark) { :root { --bg:#171513; --card:#211f1c; --ink:#f1ece4; --muted:#a59d91; --line:#36322d; --brand:#d86a3c; --err:#ff8a7a; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; padding:16px; }
  .card { width:100%; max-width:380px; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:28px 24px; box-shadow:0 8px 30px rgba(0,0,0,.06); }
  h1 { margin:0 0 4px; font-size:22px; }
  p.sub { margin:0 0 22px; color:var(--muted); font-size:14px; }
  label { display:block; font-size:14px; font-weight:600; margin:14px 0 6px; }
  input { width:100%; padding:12px 14px; font:inherit; color:inherit; background:transparent; border:1px solid var(--line); border-radius:10px; }
  input:focus { outline:2px solid var(--brand); outline-offset:1px; border-color:transparent; }
  button { width:100%; margin-top:22px; padding:12px; font:inherit; font-weight:650; color:var(--brand-ink); background:var(--brand); border:0; border-radius:10px; cursor:pointer; }
  button:disabled { opacity:.6; cursor:wait; }
  .err { color:var(--err); font-size:14px; margin-top:12px; min-height:20px; }
  .brand { font-weight:800; letter-spacing:-.02em; color:var(--brand); margin-bottom:18px; font-size:15px; }
</style>
</head>
<body>
<form class="card" id="f" autocomplete="on">
  <div class="brand">uncompromised.</div>
  <h1>Dispatch SOP</h1>
  <p class="sub">Sign in with the team password and your name.</p>
  <label for="name">Your name</label>
  <input id="name" name="name" autocomplete="name" required maxlength="60" placeholder="e.g. Ravi">
  <label for="pw">Team password</label>
  <input id="pw" name="password" type="password" autocomplete="current-password" required>
  <button id="go" type="submit">Sign in</button>
  <div class="err" id="err" role="alert"></div>
</form>
<script>
  const f = document.getElementById("f"), err = document.getElementById("err"), go = document.getElementById("go");
  try { document.getElementById("name").value = localStorage.getItem("sop_name") || ""; } catch {}
  f.addEventListener("submit", async (e) => {
    e.preventDefault(); err.textContent = ""; go.disabled = true; go.textContent = "Signing in…";
    const name = f.name.value.trim();
    try {
      const r = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ name, password: f.password.value }) });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(d.error || "Could not sign in.");
      try { localStorage.setItem("sop_name", name); } catch {}
      location.href = "/";
    } catch (x) { err.textContent = x.message; go.disabled = false; go.textContent = "Sign in"; }
  });
</script>
</body>
</html>
